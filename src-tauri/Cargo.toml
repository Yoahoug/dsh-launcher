[package]
name = "dsh-launcher"
version = "0.2.1"
description = "DSH Launcher — DeepSeek Harness 启动器桌面版"
authors = ["Yoahoug"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
sha2 = "0.10"
libc = "0.2"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Foundation", "Win32_System_ProcessStatus"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
