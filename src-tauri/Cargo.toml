[package]
name = "dsh-launcher"
version = "0.7.0"
description = "DSH Launcher — DeepSeek Harness 启动器桌面版"
authors = ["Yoahoug"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "dsh_launcher_lib"
# 仅桌面端:rlib(主程序链接)+ staticlib(兼容保留)。
# 不生成 cdylib:mingw ld 对巨型导出表(数万符号)会报 export ordinal too large,
# 且本项目无 iOS/Android 目标,cdylib 仅移动端使用。
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable:启用 Window::add_child(主窗口内原生子 WebView,DeepSeek 工作区)
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
sha2 = "0.10"
libc = "0.2"
regex = "1.13.1"
tauri-plugin-updater = "2"
# M1:签名 runtime catalog(Ed25519 验签,内置公钥;default features 含 std/signature)
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
# M1:安全解压(zip/tar.gz,防 Zip Slip / 符号链接逃逸)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# M1:URL 校验(https / 受控 ssh;拒绝凭证)
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Foundation", "Win32_System_ProcessStatus"] }

[dev-dependencies]
# dev-only:examples/catalog_tool.rs 生成 Ed25519 密钥用
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
