# dsh-launcher · 桌面版(Tauri)持续验证
# 触发:push main / 手动。与 release.yml 并存(旧打包流程保留至 M5 替换)。
# 本 workflow 只验证构建,不产出 Release 资产。
name: desktop-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    name: 桌面构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 旧核心语法检查
        run: pnpm check

      - name: 旧核心回归测试(unit + integration,fake 工具链)
        run: pnpm test

      - name: Renderer 类型检查
        run: pnpm typecheck

      - name: Renderer 构建
        run: pnpm build:renderer

      - name: Rust fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Rust 单元/契约测试
        run: cargo test
        working-directory: src-tauri

      - name: Tauri 构建(不打包安装器,验证编译)
        run: pnpm tauri build --debug --no-bundle
