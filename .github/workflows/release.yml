name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: build & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DSH Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## DSH Launcher ${{ github.ref_name }}

            DeepSeek Harness 桌面启动器 — Tauri 原生核心(无 Node daemon)。

            ### 安装说明
            - **macOS(Apple Silicon)**: 下载 `dsh-launcher.dmg` 并打开。未签名应用首次打开请在 Finder 中右键 →「打开」。
            - **Windows**: 下载 `dsh-launcher-setup.exe` 并运行。

            ### 自动更新
            应用内「设置 → 更新 → 立即检查更新」即可在线升级到本版本。
          releaseDraft: false
          prerelease: false
          createUpdaterArtifacts: true
          tauriScript: pnpm tauri
