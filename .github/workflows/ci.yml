name: ci

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-ci:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: ui tests
        run: pnpm test:ui

      - name: renderer build
        run: pnpm build:renderer

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      - name: tauri build (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle

  # Warm the release-profile cargo cache on main so tag-triggered release
  # builds (which only restore caches from the default branch) start from a
  # pre-compiled state instead of a cold compile.
  release-prebuild:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: tauri-release
          add-job-id-key: false

      - name: pnpm install
        if: steps.changes.outputs.rust == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prebuild release artifacts (no bundle)
        if: steps.changes.outputs.rust == 'true'
        run: pnpm tauri build --no-bundle
